<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.post {
    width: 1080px; height: 1080px;
    position: relative; overflow: hidden;
    background: #050505;
    font-family: 'Inter', sans-serif;
}
.bg-image {
    position: absolute; inset: 0;
    background: url('https://images.unsplash.com/photo-1534430480872-3498386e7856?w=1080') center/cover;
    filter: brightness(0.25) contrast(1.1);
}
.scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
}
.noise {
    position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none;
}
.content {
    position: relative; z-index: 2;
    height: 100%; display: flex; flex-direction: column;
    justify-content: space-between; padding: 48px;
}
.top-bar {
    display: flex; justify-content: space-between; align-items: flex-start;
}
.status {
    font-family: 'Space Mono', monospace; font-size: 13px;
    color: rgba(255,255,255,0.4); letter-spacing: 0.05em;
}
.status .dot {
    display: inline-block; width: 8px; height: 8px;
    background: #ff0033; border-radius: 50%; margin-right: 8px;
    box-shadow: 0 0 8px #ff0033;
}
.logo {
    font-family: 'Space Mono', monospace; font-size: 14px;
    font-weight: 700; color: #fff; letter-spacing: 0.1em;
}
.logo span { color: #ff0033; }
.middle {
    display: flex; flex-direction: column; gap: 20px;
}
.location {
    font-family: 'Space Mono', monospace; font-size: 14px;
    color: #00d2ff; letter-spacing: 0.15em; text-transform: uppercase;
}
.headline {
    font-size: 86px; font-weight: 900; color: #fff;
    line-height: 1.05; max-width: 950px;
    text-shadow: 3px 0 #ff0033, -3px 0 #00d2ff;
}
.subtext {
    font-size: 34px; color: rgba(255,255,255,0.7);
    line-height: 1.35; max-width: 900px;
}
.bottom-bar {
    display: flex; justify-content: space-between; align-items: flex-end;
}
.cta {
    font-family: 'Space Mono', monospace; font-size: 16px;
    color: #ff0033; letter-spacing: 0.1em; font-weight: 700;
    border: 1px solid #ff0033; padding: 12px 24px;
}
.coords {
    font-family: 'Space Mono', monospace; font-size: 12px;
    color: rgba(255,255,255,0.3); text-align: right;
    line-height: 1.8;
}
</style>
</head>
<body>
<div class="post">
    <div class="bg-image"></div>
    <div class="scanlines"></div>
    <div class="noise"></div>
    <div class="content">
        <div class="top-bar">
            <div class="status"><span class="dot"></span>TRANSMISSION_ACTIVE</div>
            <div class="logo">STORY<span>HUNT</span></div>
        </div>
        <div class="middle">
            <div class="location">// SOHO, NYC</div>
            <div class="headline">This building has been hiding a secret for 150 years.</div>
            <div class="subtext">112 Prince Street. Cast-iron facade. What's behind the door that nobody opens?</div>
        </div>
        <div class="bottom-bar">
            <div class="cta">DECODE_THE_CITY →</div>
            <div class="coords">40.7234° N<br>73.9987° W<br>storyhunt.city</div>
        </div>
    </div>
</div>
</body>
</html>
